<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Test login X</title>
</head>

<body style="font-family:monospace;padding:40px">

    <button id="login">Connect with X</button>
    <button id="logout">Logout</button>
    <button id="score">Send score 9999</button>
    <button id="board">Load leaderboard</button>
    <pre id="out">not connected</pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ljofhdhkjxsqekhzyehz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqb2ZoZGhranhzcWVraHp5ZWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTE5MjEsImV4cCI6MjEwNDE4NzkyMX0.yuOmRLLSdgsoyO_F9k1lPc8pzFN-UQnG3g663X5NV80";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById("login").onclick = () => {
            db.auth.signInWithOAuth({
                provider: "x",
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
        };

        document.getElementById("logout").onclick = async () => {
            await db.auth.signOut();
            document.getElementById("out").textContent = "logged out";
        };

        // Creates the player row on first login, updates the handle on later ones
        async function savePlayer(user) {
            const { data, error } = await db
                .from("players")
                .upsert(
                    {
                        user_id: user.id,
                        x_id: user.user_metadata.provider_id,
                        handle: user.user_metadata.user_name
                    },
                    { onConflict: "x_id" }
                )
                .select();

            console.log("savePlayer:", error || data);
        }

        // Sends a score, but only overwrites the stored best if it's higher
        async function submitScore(user, score) {
            const { data, error } = await db
                .from("players")
                .update({ best_score: score })
                .eq("user_id", user.id)
                .lt("best_score", score)
                .select();

            console.log("submitScore:", error || data);
        }

        // Top 10 players by best score
        async function loadTop10() {
            const { data, error } = await db
                .from("players")
                .select("handle, best_score")
                .order("best_score", { ascending: false })
                .limit(10);

            console.log("top10:", error || data);
            return data;
        }

        // Personal rank: how many players scored higher, plus one
        async function loadMyRank(score) {
            const { count, error } = await db
                .from("players")
                .select("*", { count: "exact", head: true })
                .gt("best_score", score);

            console.log("rank:", error || count + 1);
            return count + 1;
        }

        // Runs on load: shows the session if the user is already signed in
        db.auth.getSession().then(({ data }) => {
            if (data.session) {
                document.getElementById("out").textContent =
                    JSON.stringify(data.session.user.user_metadata, null, 2);
                savePlayer(data.session.user);

                document.getElementById("score").onclick = () => {
                    submitScore(data.session.user, 9999);
                };

                document.getElementById("board").onclick = () => {
                    loadTop10();
                    loadMyRank(9999);
                };
            }
        });
    </script>
</body>

</html>
