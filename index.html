<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DGM — Demon Got Me (prototype)</title>
<style>
  /* Minimal page styling: dark page, centered canvas, no scrollbars */
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0e;
    height: 100%;
    overflow: hidden;
    touch-action: none; /* prevents mobile scroll/zoom while tapping */
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    /* Size is set from JS (fitCanvas) to fill the window while keeping the 3:2 ratio */
    display: block;
    image-rendering: pixelated;
    outline: none;
  }
</style>
</head>
<body>
<!-- The canvas is the whole console (CANVAS_W x CANVAS_H, matching the
     frame_cabinet images); the game renders inside its screen window -->
<canvas id="game" width="1663" height="946"></canvas>

<script>
"use strict";

/* =====================================================================
   TUNABLE CONSTANTS — everything you might want to tweak lives here.
   All speeds are in pixels/second, all durations in seconds.
   ===================================================================== */

// --- Screen & cabinet ---
// The canvas matches the console art (frame_cabinet_phase1/2.png, 1663x946).
// The game itself renders inside the console's transparent screen window,
// whose position/size below were measured from the PNG.
const CANVAS_W = 1663;             // full canvas width = cabinet image width (must match the <canvas> tag)
const CANVAS_H = 946;              // full canvas height = cabinet image height
const SCREEN_X = 319;              // screen window left edge inside the cabinet art (px)
const SCREEN_Y = 119;              // screen window top edge (px)
const SCREEN_W = 1021;             // screen window width  — this is the game's playfield width
const SCREEN_H = 548;              // screen window height — this is the game's playfield height
const BOOT_LINE_T = 0.9;           // CRT "screen turns on" line effect duration (s)
const BOOT_VERSION_T = 1.9;        // version screen duration right after the line effect (s)
// --- Intro (played ON the home page, ONCE per session: run -> bump -> blink -> run) ---
const INTRO_CHAR_H = 190;          // display height of the home/intro character (px)
const INTRO_WALK_SPEED = 450;      // run speed toward the cactus (px/s)
const INTRO_RUN_FPS = 14;          // 2-frame run loop speed during the dash (fast = smooth)
const HOME_CHAR_FRAC = 0.14;       // idle character position on home: LEFT side (fraction of width)
const INTRO_CACTUS_FRAC = 0.72;    // cactus position: right part, close to the menu
const INTRO_CACTUS_H = 100;        // cactus display height (px)
const INTRO_BLINK_T = 0.5;         // hurt blink at the bump: 2 transparent blinks in this window (s)
const INTRO_RUNOUT_T = 0.9;        // bare runner sprinting off screen after the bump (s)
const INTRO_WIPE_T = 0.5;          // black wipe sliding in before the game starts (s)
const DEATH_SEQUENCE_DURATION = 3.2; // death "beat-up" + GAME OVER slide duration (s)
const GAMEOVER_BEAT_FRAME_T = 0.35;  // beat-up loop speed: gameover_character_1 <-> _2 (s per frame)
const GAMEOVER_FINAL_FRAC = 0.85;    // when gameover_character_5 takes over (fraction of the sequence)
const TITLE_SLIDE_DURATION = 0.6;  // how long the home title takes to slide in (s)

// --- World speed & score calibration ---
const BASE_SPEED = 340;            // world scroll speed at the very start of a run (px/s)
const SPEED_RAMP_PHASE1 = 4;       // extra speed gained per second during phase 1 (px/s per s)
const MAX_SPEED_PHASE1 = 480;      // speed cap during phase 1 (px/s)
const SCORE_PER_PIXEL = 0.045;     // score gained per pixel traveled (calibrated: 666 in ~35-40s)

// --- Phase system ---
const PHASE_2_SCORE = 666;         // score threshold that triggers the "demon got me" switch
const CORRUPTION_START = 500;      // score where the world visually starts to corrupt (phase 1)
const PHASE2_GRACE_DURATION = 2.5; // slower "adaptation window" right after the switch (s)
const PHASE2_GRACE_MULT = 0.8;     // speed multiplier applied during the grace window
const PHASE2_SPEED_MULT = 1.3;     // speed multiplier once the grace window ends
const SPEED_RAMP_PHASE2 = 6;       // extra speed gained per second during phase 2 (px/s per s)
const MAX_SPEED_PHASE2 = 700;      // absolute speed cap in phase 2 (px/s)

// --- Player physics (the FEEL knobs) ---
// NOTE: gravity and jump speeds were scaled x1.5 together with the bigger
// world so the jump KEEPS the same duration and feel, just covers more pixels.
const GRAVITY = 3450;              // downward acceleration (px/s²)
const JUMP_VELOCITY = 1080;        // initial upward speed of a jump (px/s)
const DOUBLE_JUMP_VELOCITY = 1020; // upward speed of the second (air) jump (px/s)
const JUMP_CUT_MULT = 0.45;        // releasing early multiplies upward speed by this (tap = short hop)
const HODL_FALL_SPEED = 165;       // max fall speed while the button is HELD ("HODL" glide, px/s)
const MAX_FALL_SPEED = 1650;       // max fall speed in normal free fall (px/s)
const COYOTE_TIME = 0.08;          // grace period to still jump right after leaving the ground (s)
const JUMP_BUFFER_TIME = 0.10;     // pressing jump this early before landing still triggers it (s)

// --- Player hitbox (NEVER changes during a run, only visuals change) ---
const PLAYER_X = 230;              // fixed horizontal position of the player (~22% from the left; more left = more reaction time)
const PLAYER_W = 84;               // hitbox width (px) — sized to the sprite: head AND tail are inside
const PLAYER_H = 92;               // hitbox height (px) — matches the drawn character height
const HITBOX_PAD = 6;              // collision forgiveness: hitbox is shrunk by this on each side (px)

// --- Player sprites (phase 1) ---

const HOLD_FRAME_COUNT = 3;        // number of player_p1_hold_* frames

                                   // run, jump, doublejump and hold all render the same size

const OVERHEAD_CLEARANCE = 38;     // free space between the player's head (running) and an overhead block (px)
const GAP_WIDTH_MIN = 110;         // hole in the ground: min width (px) — must stay jumpable
const GAP_WIDTH_MAX = 170;         // hole in the ground: max width (px)

// --- Collectibles (3 kinds: points, boost, hodl) ---
const COLLECT_VALUE = 20;          // score gained per POINTS collectible
const COLLECT_RADIUS = 22;         // collectible half-height (px) — the pickup box hugs the artwork

// --- BOOST pickup (collectible_boost) ---
const BOOST_DURATION = 1.6;        // seconds of boost after grabbing one
const BOOST_SPEED_MULT = 1.45;     // world speed multiplier while boosted
// While boosted the player SMASHES through obstacles (holes still kill!)

// --- HODL meter (the glide is now a resource, refilled by collectible_hodl) ---
const HODL_METER_MAX = 3.0;        // max seconds of glide the meter can store
const HODL_START = 1.5;            // glide seconds available at the start of a run
const HODL_REFILL = 1.0;           // glide seconds given by one HODL token
// Tip: set HODL_START and HODL_METER_MAX very high to get the old unlimited glide back

// --- Fire (phase 2) — DECORATIVE ONLY: flames lick the left edge, never kill ---
const FIRE_WALL_X = 26;            // fixed x position of the decorative flame edge (px)

// --- 666 transition ---
const PHASE2_FREEZE_T = 1.0;       // gameplay freeze at the switch, so the 666 can sink in (s)
const PHASE2_666_T = 2.0;          // how long the big 666 stays highlighted on screen (s)

// --- Corruption omen: the "sonic" (spam_warning_1/2) approaching from afar ---
const SONIC_FRAME_T = 0.35;        // seconds per frame of the 2-frame stop-motion loop
const SONIC_MAX_ALPHA = 0.30;      // its transparency once gigantic (at 666)
const SONIC_END_SCALE = 1.4;       // its height at 666, as a fraction of the screen height

// --- HUD placement (the cabinet art slightly overlaps the window edges) ---
const HUD_INSET_X = 64;            // horizontal distance of the HUD from the screen edges (px)
const HUD_INSET_Y = 42;            // vertical distance of the HUD from the top (px)

// --- Phase 2 background animation (visual only, gameplay untouched) ---
// The bg_phase2.png image itself is drawn once and stays FIXED; only the
// effects layered on top of it (flames, smoke, embers) are animated.
const BG_FLAME_COUNT = 5;          // extra procedural flame spots over the painted fires
const BG_SMOKE_RATE = 0.18;        // seconds between two rising smoke puffs
const BG_SMOKE_MAX = 40;           // cap on simultaneous smoke puffs (keeps things subtle)
const BG_EMBER_COUNT = 14;         // floating embers drifting through the air

// --- Juice / feedback ---
const FLASH_DURATION = 0.12;       // duration of screen flashes (s)
const SHAKE_DURATION = 0.35;       // duration of screen shake on death / phase switch (s)
const SHAKE_STRENGTH = 6;          // max shake offset (px)
const RESTART_LOCK = 0.5;          // delay before the game-over screen accepts a restart input (s)
const SOUND_VOLUME = 0.07;         // master volume of the little beeps (0 = mute)

/* =====================================================================
   SETUP
   ===================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// W/H are the GAME's coordinates: every screen and all gameplay render inside
// the console's screen window, whose size is SCREEN_W x SCREEN_H.
const W = SCREEN_W;
const H = SCREEN_H;

// --- Responsive scaling: fill the window, keep the cabinet ratio, stay centered ---
function fitCanvas() {
  const scale = Math.min(window.innerWidth / CANVAS_W, window.innerHeight / CANVAS_H);
  canvas.style.width = Math.floor(CANVAS_W * scale) + "px";
  canvas.style.height = Math.floor(CANVAS_H * scale) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

/* ---------------------------------------------------------------------
   IMAGE SLOT SYSTEM
   Each visual element tries to load assets/<slot>.png. If the file is
   missing, the game silently draws its colored-shape placeholder instead.
   Drop a PNG into assets/ later and it replaces the shape automatically,
   without touching the code.
   --------------------------------------------------------------------- */
const ASSET_SLOTS = [
  "frame_cabinet", "frame_cabinet_phase1", "frame_cabinet_phase2",
  "home_bg", "home_title",
  "home_character", "home_character_1", "home_character_run1", "home_character_run2",
  "home_character_hurt1", "home_character_hurt2", "home_character_hurt3",
  "player_p1_run_1", "player_p1_run_2", "player_p1_run_3",
  "player_p1_run_4", "player_p1_run_5", "player_p1_run_6",
  "player_p1_hold_1", "player_p1_hold_2", "player_p1_hold_3",
  "player_p1_jump", "player_p1_doublejump", "player_p1_hurt",
  "player_p2_run_1", "player_p2_run_2", "player_p2_run_3",
  "player_p2_run_4", "player_p2_run_5", "player_p2_run_6",
  "player_p2_hold_1", "player_p2_hold_2", "player_p2_hold_3",
  "player_p2_jump", "player_p2_doublejump", "player_p2_hurt",
  "obstacle_ground_p1", "obstacle_ground_p1_1", "obstacle_ground_p1_2", "obstacle_ground_p1_3",
  "obstacle_air_p1", "obstacle_air_p1_1", "obstacle_air_p1_2", "obstacle_air_p1_3",
  "obstacle_ground_p2", "obstacle_ground_p2_1", "obstacle_ground_p2_2", "obstacle_ground_p2_3",
  "obstacle_air_p2", "obstacle_air_p2_1", "obstacle_air_p2_2", "obstacle_air_p2_3",
  "collectible_points", "collectible_points_p1", "collectible_points_p2",
  "collectible_boost", "collectible_hodl",
  "pause_menu_check", "spam_warning_1", "spam_warning_2",
  "gear_jetpack", "gear_sneaker",
  "bg_phase1", "bg_phase2", "ground_phase1", "ground_phase2",
  "gameover_character_1", "gameover_character_2", "gameover_character_3",
  "gameover_character_4", "gameover_character_5",
  "leaderboard_bg", "leaderboard_character",
  "leaderboard_character_1", "leaderboard_character_2",
  "leaderboard_character_3", "leaderboard_character_4"
];
const assets = {}; // only slots whose PNG actually loaded end up in here

for (const name of ASSET_SLOTS) {
  const img = new Image();
  img.onload = () => { assets[name] = img; };
  img.onerror = () => { /* file missing: the fallback shape will be drawn, no error */ };
  img.src = "assets/" + name + ".png";
}

// Some source images have transparent padding around the artwork. This table
// (opaque pixel bounds, measured from the PNGs) lets drawSlot render ONLY the
// artwork — so the drawn rect, and therefore the hitbox, hugs the visible
// pixels on all four sides. Re-measure if these images are replaced.
const SPRITE_TRIM = {
  "obstacle_ground_p2_1": { x: 271, y: 212, w: 473, h: 608 },  // gorilla
  "obstacle_ground_p2_2": { x: 227, y: 214, w: 597, h: 614 },  // jabba
  "obstacle_ground_p2_3": { x: 348, y: 214, w: 335, h: 594 },  // moai
  "obstacle_air_p2_1": { x: 367, y: 69, w: 289, h: 824 },
  "obstacle_air_p2_2": { x: 171, y: 142, w: 581, h: 729 },
  "obstacle_air_p2_3": { x: 193, y: 250, w: 638, h: 524 },
  "obstacle_air_p1_1": { x: 181, y: 134, w: 1177, h: 697 },
  "collectible_points_p1": { x: 201, y: 202, w: 622, h: 619 },
  "collectible_points_p2": { x: 252, y: 192, w: 521, h: 640 },
  "collectible_boost": { x: 202, y: 263, w: 620, h: 486 },
  "collectible_hodl": { x: 290, y: 219, w: 440, h: 584 },
  "pause_menu_check": { x: 403, y: 332, w: 1237, h: 1378 },
  "spam_warning_1": { x: 522, y: 525, w: 1155, h: 1150 },
  "spam_warning_2": { x: 522, y: 525, w: 1155, h: 1150 },
  "leaderboard_character_1": { x: 133, y: 220, w: 758, h: 639 },
  "leaderboard_character_2": { x: 99, y: 191, w: 628, h: 640 },
  "leaderboard_character_3": { x: 200, y: 216, w: 616, h: 616 },
  "leaderboard_character_4": { x: 304, y: 155, w: 467, h: 670 }
};

// Draws the slot image if it loaded (using its trim when measured).
// Returns true if drawn, false so the caller draws the fallback shape.
function drawSlot(name, x, y, w, h) {
  const img = assets[name];
  if (!img) return false;
  const t = SPRITE_TRIM[name];
  if (t) ctx.drawImage(img, t.x, t.y, t.w, t.h, x, y, w, h);
  else ctx.drawImage(img, x, y, w, h);
  return true;
}

// width/height ratio of a slot's VISIBLE artwork (trimmed if measured)
function slotAspect(name) {
  const t = SPRITE_TRIM[name];
  if (t) return t.w / t.h;
  const img = assets[name];
  return img ? img.width / img.height : 1;
}

// Game state machine — one screen at a time:
// "boot" -> "home" -> "intro" -> "playing" -> "dying" -> "gameover" -> "leaderboard"
let state = "boot";
let bootTimer = BOOT_LINE_T + BOOT_VERSION_T; // counts down the whole boot sequence
let homeTime = 0;              // time spent on the home screen (drives animations)

try { bestScore = Number(localStorage.getItem("dgm_best")) || 0; } catch (e) {}

// Run variables (initialized in resetRun)
let player, obstacles, gaps, collectibles, particles, popups;
let score, runTime, currentSpeed, worldX;
let phase, speedAtSwitch, graceTimer, phase2Time;
let hazardTimer, collectTimer;
let holding = false;       // is the jump button currently held? (drives HODL glide)

let shakeTimer = 0;

let introSeen = false;     // the cactus gag plays only once per session
let gearDebris = [];       // intro only: jetpack & sneakers bouncing away
let bootSoundPlayed = false; // soft power-on sound, once (browsers may mute it before any click)
let bootChimeDone = false;   // fallback: play the chime on the FIRST press (audio unlocked there)
let corruptStartAt = -1;   // runTime when the score crossed CORRUPTION_START (-1 = not yet)
let corruptDuration = 1;   // time 500 -> 666 with zero pickups (the sonic's growth pace)
let sonicGrowFinal = 0;    // the sonic's growth level frozen at the 666 switch

function resetRun() {
  player = {
    x: PLAYER_X,
    y: GROUND_Y - PLAYER_H,
    vy: 0,               // vertical speed (positive = falling)
    grounded: true,
    jumpsUsed: 0,        // 0 = fresh, 1 = jumped, 2 = double jump used
    coyoteTimer: 0       // time since the player left the ground without jumping
  };
  obstacles = [];        // {type:'ground'|'overhead', x, y, w, h}
  gaps = [];             // {x, w} holes in the ground
  collectibles = [];     // {x, y, r}
  particles = [];        // {x, y, vx, vy, life, color, size}
  popups = [];           // floating texts {x, y, text, life, color, big}
  score = 0;
  runTime = 0;
  currentSpeed = BASE_SPEED;
  worldX = 0;            // total distance traveled, used for ground marks animation
  phase = 1;
  speedAtSwitch = 0;
  graceTimer = 0;
  phase2Time = 0;
  freezeTimer = 0;
  transitionTimer = 0;
  paused = false;
  corruptStartAt = -1;
  sonicGrowFinal = 0;
  hazardTimer = 1.2;     // small breather before the first obstacle
  collectTimer = 2.0;
  jumpBufferTimer = 0;
  squash = 1;
  bgSmoke = [];
  bgSmokeTimer = 0;
  boostTimer = 0;
  hodlMeter = HODL_START;
